packages:
  - bundler-packages/*
  - bundler-packages/resolutions-rs/npm/*
  - bundler-packages/runtime-rs/npm/*
  - bundler
  - cli
  - configs/*
  - docs/*
  - evals
  - examples/*
  - extensions/*
  - lsp/*
  - packages/*
  - scripts
  - sites/*
  - src
  - src/ui
  - tevm
  - test/*
  - ../zevm/npm/zevm
  - ../zevm/npm/platforms/*
# The vendored @evmts/zevm declares one optional platform package per target.
# Record every one of them, so the lockfile is the same bytes on a macOS
# developer host and a Linux runner and --frozen-lockfile agrees on both.
# The platform packages are optionalDependencies on a plain version, not the
# workspace: protocol, so they must link to the vendored workspace members
# rather than resolve from the registry.
linkWorkspacePackages: true
supportedArchitectures:
  os: [current, darwin, linux, freebsd, win32]
  cpu: [current, x64, arm64, ia32]
  libc: [current, glibc, musl]
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@jazzer.js/fuzzer"
  - "@swc/core"
  - bufferutil
  - bun
  - esbuild
  - fsevents
  - keccak
  - nx
  - secp256k1
  - sharp
  - utf-8-validate
  - wasm-pack
# Security overrides for transitive dependencies that the direct dependents
# have not yet raised. Each range matches only vulnerable versions, so a
# dependent that already resolves a patched release is unaffected.
overrides:
  # GHSA-587h-7wmj-h5pm (launch-editor). vocs 1.4.1 requires vite ^7.
  vite@>=7.0.0 <7.3.7: ^7.3.7
  # forge-deploy (tar 6) and @mapbox/node-pre-gyp (tar 7.5.15).
  tar@<7.5.21: ^7.5.21
  # forge-deploy 0.2.0 pins axios ^0.26.
  axios@<0.35.0: ^0.35.0
  # nx 22.7.2 and solc-typed-ast pull axios 1.16.
  axios@>=1.0.0 <1.20.0: ^1.20.0
  # terser-webpack-plugin 5.3.14.
  serialize-javascript@<7.0.3: ^7.0.3
  # live-server -> chokidar 2 / micromatch 3.
  braces@<3.0.3: ^3.0.3

# @smthrs/ui publishes TypeScript source whose public types import d3-force, but
# it lists @types/d3-force only as a devDependency, so consumers that type-check
# it (sites/contributor) fail with TS7016. Remove once @smthrs/ui ships the types.
packageExtensions:
  "@smthrs/ui@0.33.0":
    dependencies:
      "@types/d3-force": "^3.0.10"

patchedDependencies:
  "@arethetypeswrong/core@0.18.2": patches/@arethetypeswrong__core@0.18.2.patch
