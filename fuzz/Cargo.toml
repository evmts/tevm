[package]
name = "tevm-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
tevm_resolutions_rs = { path = "../bundler-packages/resolutions-rs" }
tevm_solc_rs = { path = "../bundler-packages/solc-rs" }

[[bin]]
name = "fuzz_resolve_imports"
path = "fuzz_targets/fuzz_resolve_imports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_resolve_import_path"
path = "fuzz_targets/fuzz_resolve_import_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_solc_models"
path = "fuzz_targets/fuzz_solc_models.rs"
test = false
doc = false
bench = false
