name: Daily Claude Auto-Updates
on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering
    
env:
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  update:
    name: Run Claude Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Checkout pinned native sources
        run: node scripts/factory/checkout-native.mjs

      # The shared setup installs Zig via mise before pnpm runs postinstall.
      - name: Setup
        uses: ./.github/actions/setup
      
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
        shell: bash

      - name: Run Claude Code on update files
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEVM_RPC_URLS_MAINNET: ${{ secrets.TEVM_RPC_URLS_MAINNET }}
          TEVM_RPC_URLS_OPTIMISM: ${{ secrets.TEVM_RPC_URLS_OPTIMISM }}
        run: |
          set -euo pipefail

          # Set up flag to track if any changes were made
          CHANGES_MADE=0
          
          # Find all update-* files in the .claude/commands directory
          UPDATE_FILES=$(find .claude/commands -maxdepth 1 -type f -name "update-*" | sort)
          
          # Process each update file
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi

            echo "Processing $file..."
            
            # Run Claude Code with the update file contents.
            CLAUDE_OUTPUT=$(mktemp)
            if ! claude --print --permission-mode bypassPermissions < "$file" > "$CLAUDE_OUTPUT" 2>&1; then
              cat "$CLAUDE_OUTPUT"

              if grep -qi "Credit balance is too low" "$CLAUDE_OUTPUT"; then
                echo "::warning title=Claude auto-update skipped::Claude API credit balance is too low; skipping automated updates."
                CHANGES_MADE=0
                rm -f "$CLAUDE_OUTPUT"
                break
              fi

              rm -f "$CLAUDE_OUTPUT"
              exit 1
            fi
            cat "$CLAUDE_OUTPUT"
            rm -f "$CLAUDE_OUTPUT"
            
            # Check if changes were made
            if [ -n "$(git status --porcelain)" ]; then
              CHANGES_MADE=1
            else
              echo "No changes from processing $file"
            fi
          done <<< "$UPDATE_FILES"
          
          # Set output for use in later steps
          echo "CHANGES_MADE=$CHANGES_MADE" >> "$GITHUB_OUTPUT"
        shell: bash
      
      - name: Open maintenance pull request
        if: steps.claude.outputs.CHANGES_MADE == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/daily-claude-updates
          delete-branch: true
          commit-message: "chore: apply daily Claude updates"
          title: "chore: daily Claude updates"
          body: "Automated maintenance changes for maintainer review."

      - name: Cleanup if no changes
        if: steps.claude.outputs.CHANGES_MADE == '0'
        run: |
          echo "No changes were made"
        shell: bash
