name: Setup
description: Set up the Tevm CI toolchain and workspace dependencies
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install cbindgen
      run: |
        cargo install --locked cbindgen
      shell: bash

    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        registry-url: https://registry.npmjs.org

    - name: Set up Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: 1.2.13

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.14.0

    - name: Install pnpm
      run: |
        npm i pnpm@10.33.4 --global && pnpm --version
      shell: bash

    # Pinned deliberately: ../zevm/npm/zevm is a pnpm-workspace member of this repo, so its
    # package.json specifiers are recorded in our pnpm-lock.yaml. Cloning zevm at HEAD meant any
    # dependency bump landing in evmts/zevm instantly broke `pnpm install --frozen-lockfile` here
    # with ERR_PNPM_OUTDATED_LOCKFILE, failing CI on every PR for reasons unrelated to that PR.
    # Bump this SHA and regenerate pnpm-lock.yaml in the same commit.
    - name: Checkout Zevm workspace
      env:
        ZEVM_REF: 014f3f2b8dba45a983853af303bc52620fcfb111
      run: |
        if [ ! -d ../zevm/npm/zevm ]; then
          git clone --filter=blob:none https://github.com/evmts/zevm.git ../zevm
          git -C ../zevm checkout --detach "$ZEVM_REF"
        fi
      shell: bash

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.7.1

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build Zevm workspace
      run: pnpm --filter @evmts/zevm build
      shell: bash

    - name: Install native dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev
