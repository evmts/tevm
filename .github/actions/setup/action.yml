# Generated by smthrs from //.github:github. Do not edit; run: smthrs //.github:github --write
name: setup
description: Install the workspace toolchain and connect the smithers remote cache.
inputs:
  cache-url:
    description: Exported to the job environment as SMITHERS_CACHE_URL.
    required: false
    default: ""
  cache-token:
    description: Exported to the job environment as SMITHERS_CACHE_TOKEN.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - run: git submodule update --init -- vendor/flows
      shell: bash
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
    - uses: dtolnay/rust-toolchain@stable
    - uses: jdx/mise-action@v4
      with:
        install: "true"
        cache: "true"
    - uses: actions/cache@v4
      with:
        path: "~/.pnpm-store"
        key: "pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}"
        restore-keys: pnpm-store-
    - run: pnpm install --frozen-lockfile
      shell: bash
    - shell: bash
      env:
        CACHE_URL: ${{ inputs.cache-url }}
        CACHE_TOKEN: ${{ inputs.cache-token }}
      run: |
        if [[ -n "$CACHE_URL" ]]; then
          [[ "$CACHE_URL$CACHE_TOKEN" != *$'\n'* && "$CACHE_URL$CACHE_TOKEN" != *$'\r'* ]] || exit 1
          printf 'SMITHERS_CACHE_URL=%s\nSMITHERS_CACHE_TOKEN=%s\n' "$CACHE_URL" "$CACHE_TOKEN" >> "$GITHUB_ENV"
        fi
