[package]
name = 'tevm_runtime_rs'
version = '0.1.0'
edition = '2021'

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alloy-primitives = { version = "1.7.3", features = ["serde"] }
foundry-compilers = { version = "0.21.0", default-features = false, features = ["async", "full"] }
hex = "0.4.3"
node-resolve = "2.2.0"
once_cell = "1.21.4"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
tempfile = "3.27.0"
tevm_solc_rs = { path = "../solc-rs" }

# NAPI bindings
napi = { version = "3.16.2", default-features = false, features = ["napi8", "tokio_rt", "serde-json", "async"] }
napi-derive = "3.7.1"
libc = "0.2.191"

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
# Standalone Rust test and example binaries run outside a Node host.
napi = { version = "3.16.2", default-features = false, features = ["dyn-symbols"] }
proptest = "1.12"

# Parse generated JS, TS and declarations and check for duplicate bindings in tests.
oxc = { version = "0.159", default-features = false, features = ["semantic"] }
