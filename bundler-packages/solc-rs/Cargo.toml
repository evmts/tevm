[package]
name = 'tevm_solc_rs'
version = '0.1.0'
edition = '2021'
description = 'A typesafe Rust wrapper for the Solidity compiler (solc)'
authors = ["TEVM Contributors"]
license = "MIT"
repository = "https://github.com/evmts/tevm"
readme = "README.md"
keywords = ["solidity", "compiler", "ethereum", "solc", "tevm"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.19.1"
thiserror = "2.0.12"
hex = "0.4.3"

# NAPI bindings
napi = { version = "2.16.0", default-features = false, features = ["napi4", "tokio_rt", "serde-json", "compat-mode", "async", "napi8"] }
napi-derive = "2.16.0"
libc = "0.2.172"

[build-dependencies]
napi-build = "2.0.1"

[lib]
crate-type = [
    'cdylib',
    'rlib',
]

[features]
default = []
examples = []

[[example]]
name = "basic_usage"
path = "src/examples/basic_usage.rs"
required-features = ["examples"]

