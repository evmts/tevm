[package]
name = 'tevm_solc_rs'
version = '0.1.0'
edition = '2021'
description = 'A typesafe Rust wrapper for the Solidity compiler (solc)'
authors = ["TEVM Contributors"]
license = "MIT"
repository = "https://github.com/evmts/tevm"
readme = "README.md"
keywords = ["solidity", "compiler", "ethereum", "solc", "tevm"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
hex = "0.4.3"

# NAPI bindings
napi = { version = "3.16.2", default-features = false, features = ["napi8", "tokio_rt", "serde-json", "async"] }
napi-derive = "3.7.1"
libc = "0.2.191"

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
proptest = "1.6"

[lib]
crate-type = [
    'cdylib',
    'rlib',
]

[features]
default = []
examples = []

[[example]]
name = "basic_usage"
path = "src/examples/basic_usage.rs"
required-features = ["examples"]

