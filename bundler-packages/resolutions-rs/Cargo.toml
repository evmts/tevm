[package]
name = 'tevm_resolutions_rs'
version = '0.1.0'
edition = '2021'

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Async utilities
futures = "0.3.34"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
]}
dashmap = "6.2.1"

# Node module resolution
node-resolve = "2.2.0"

# Utilities
once_cell = "1.21.4"
num_cpus = "1.17.0"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Solidity parsing
solar = { version = "0.3.0", package = "solar-compiler" }
tempfile = "3.27.0"

# NAPI bindings
napi = { version = "3.16.2", default-features = false, features = ["napi8", "tokio_rt", "serde-json", "async"] }
napi-derive = "3.7.1"
libc = "0.2.191"

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
proptest = "1.6"
